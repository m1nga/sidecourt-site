name: Publish CleanPause website
on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/cleanpause-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cleanpause-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build and verify original packages
        env:
          GH_TOKEN: ${{ secrets.CLEANPAUSE_ASSETS_TOKEN }}
        run: python3 website/build.py
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Remove temporary package artifact after successful deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          run = os.environ['GITHUB_RUN_ID']
          result = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/runs/{run}/artifacts'], text=True))
          for artifact in result['artifacts']:
              if artifact['name'] == 'github-pages':
                  subprocess.run(['gh', 'api', '-X', 'DELETE', f'repos/{repo}/actions/artifacts/{int(artifact["id"])}'], check=True)
          PY
