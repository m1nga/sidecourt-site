name: Publish CleanPause website
on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/cleanpause-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cleanpause-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build and verify original packages
        env:
          GH_TOKEN: ${{ secrets.CLEANPAUSE_ASSETS_TOKEN }}
        run: python3 website/build.py
      # upload-pages-artifact v4+ excludes every hidden path, which would drop the
      # OAuth discovery documents under /.well-known. Archive the same way but keep them.
      - name: Archive site including .well-known
        shell: sh
        run: |
          tar --dereference --hard-dereference --directory _site -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github --exclude=.nojekyll .
          tar -tf "$RUNNER_TEMP/artifact.tar" | grep -F './.well-known/' 
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (same pin as upload-pages-artifact)
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Remove temporary package artifact after successful deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          run = os.environ['GITHUB_RUN_ID']
          result = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/runs/{run}/artifacts'], text=True))
          for artifact in result['artifacts']:
              if artifact['name'] == 'github-pages':
                  subprocess.run(['gh', 'api', '-X', 'DELETE', f'repos/{repo}/actions/artifacts/{int(artifact["id"])}'], check=True)
          PY
